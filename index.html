<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Kisah Kopel Piksel</title>
    <!-- PRELOAD LAYAR JUDUL
         Gambar yang dipasang lewat background CSS (latar, pohon, kucing,
         burung, kelopak) baru diminta browser setelah tata letak dihitung,
         jadi datangnya paling akhir dan layar sempat tampak kosong. Dengan
         preload semuanya langsung diantre bersama <img> judul & pasangan. -->
    <link rel="preload" as="image" href="gambarpixel/anim/title_bg_clean_hi.webp" fetchpriority="high">
    <link rel="preload" as="image" href="gambarpixel/anim/pohon_burung.webp">
    <link rel="preload" as="image" href="gambarpixel/anim/cat_walk.webp">
    <link rel="preload" as="image" href="gambarpixel/anim/bird_idle.webp">
    <link rel="preload" as="image" href="gambarpixel/anim/petals_near.png">
    <link rel="preload" as="image" href="gambarpixel/anim/petals_far.png">
    <link rel="preload" as="image" href="gambarpixel/anim/cursor_sword.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans&display=swap');

        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Press Start 2P', monospace;
            background-color: #ffd8c7;
            color: #3d2626;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* KURSOR PEDANG DI SELURUH HALAMAN
           Alamat gambarnya disimpan sekali di variabel supaya setiap tempat
           yang menyetel cursor memakai gambar yang sama. Aturan bintang
           membuat elemen yang tidak punya aturan sendiri -- termasuk kolom
           isian yang bawaannya kursor teks -- ikut mewarisi. */
        :root { --kursor: url('gambarpixel/anim/cursor_sword.png') 3 3; }
        html, body { cursor: var(--kursor), auto; }
        *, *::before, *::after { cursor: inherit; }

        /* KETAJAMAN GAMBAR
           .stage paling lebar 1400 px sedangkan mockup aslinya 1024 px, jadi
           browser harus memperbesar 1,367x. Dengan image-rendering: pixelated
           pembesaran pecahan seperti itu membuat lebar piksel tidak seragam
           (ada yang 1 px, ada yang 2 px) -- itu yang terlihat kasar dan buram.
           Semua aset pixel art kini disimpan jauh lebih besar daripada ukuran
           tampilnya, jadi browser hanya perlu MEMPERKECIL, dan pengecilan
           halus menghasilkan tepi tajam yang rata. Karena itu seluruh gambar
           memakai penyaringan bawaan. */
        img,
        .stage,
        #scrolling-bg,
        .gallery-page,
        .guard,
        .vol-btn,
        .ld-sky > i,
        .ld-horse,
        .petal-layer > i,
        .dash-scene > i,
        .dash-horse,
        .slot-photo,
        .photobooth-img,
        #lightbox img {
            image-rendering: auto;
        }

        .pixel-box {
            background-color: #ffead1;
            border: 4px solid #3d2626;
            padding: 20px;
            box-shadow:
                inset 4px 4px 0px rgba(255,255,255,0.7),
                inset -4px -4px 0px rgba(0,0,0,0.1),
                4px 4px 0px rgba(0,0,0,0.15);
            position: relative;
        }

        .pixel-btn {
            font-family: 'Press Start 2P', monospace;
            background-color: #ff9d9d;
            border: 4px solid #3d2626;
            color: #3d2626;
            padding: 12px 20px;
            cursor: var(--kursor), pointer;
            box-shadow:
                inset 4px 4px 0px rgba(255,255,255,0.5),
                inset -4px -4px 0px rgba(0,0,0,0.2),
                2px 2px 0px rgba(0,0,0,0.2);
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
            transition: transform 0.1s;
        }
        .pixel-btn:hover {
            background-color: #ffb3b3;
        }
        .pixel-btn:active {
            transform: translateY(2px);
            box-shadow:
                inset 4px 4px 0px rgba(0,0,0,0.1),
                inset -4px -4px 0px rgba(255,255,255,0.3);
        }

        .title-bar {
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 4px solid #3d2626;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }
        .title-icon {
            color: #d2606a;
        }

        /* SCREENS */
        #screen-title, #screen-login {
            height: 100vh;
            width: 100vw;
            background: linear-gradient(to bottom, #ffcba4 0%, #ff9d9d 40%, #b5838d 70%, #2a223a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .landscape {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            background-color: #1f182b;
            clip-path: polygon(0 50%, 10% 40%, 25% 60%, 40% 30%, 55% 55%, 70% 20%, 85% 50%, 100% 35%, 100% 100%, 0% 100%);
            z-index: 1;
        }

        #screen-title .content-wrapper, #screen-login .pixel-box {
            position: relative;
            z-index: 2;
        }

        #screen-title h1 {
            font-size: 4rem;
            color: #ffead1;
            text-shadow: 6px 6px 0 #3d2626, -2px -2px 0 #3d2626, 2px -2px 0 #3d2626, -2px 2px 0 #3d2626, 2px 2px 0 #3d2626;
            margin-bottom: 60px;
            text-align: center;
            line-height: 1.2;
        }

        .blink {
            animation: blinker 1.2s linear infinite;
            cursor: var(--kursor), pointer;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 3px 3px 0 #3d2626;
            text-align: center;
        }
        .blink:hover {
            color: #ffead1;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* LOGIN SCREEN */
        #screen-login .pixel-box {
            width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .login-input {
            font-family: 'Press Start 2P', monospace;
            background: #fff;
            border: 4px solid #3d2626;
            padding: 15px;
            width: 80%;
            text-align: center;
            font-size: 1.2rem;
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.1);
            outline: none;
        }
        .login-input:focus {
            background-color: #fffae6;
        }

        .error-message {
            color: #d2606a;
            font-size: 0.8rem;
            margin-top: -10px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        /* MAIN DASHBOARD SCREEN */
        #screen-main {
            height: 100vh;
            width: 100vw;
            background-image:
                linear-gradient(rgba(220, 120, 120, 0.2) 2px, transparent 2px),
                linear-gradient(90deg, rgba(220, 120, 120, 0.2) 2px, transparent 2px);
            background-size: 40px 40px;
            padding: 30px;
        }

        .main-container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            height: calc(100vh - 60px);
            margin: 0 auto;
        }

        .sidebar {
            flex: 0 0 280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .sidebar-item {
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .sidebar-item.clickable {
            cursor: var(--kursor), pointer;
            transition: transform 0.1s;
        }
        .sidebar-item.clickable:hover {
            background-color: #fff4e6;
            transform: translateX(5px);
        }

        .submenu {
            margin-top: 15px;
            border-top: 2px dashed #3d2626;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .submenu-item {
            font-size: 0.75rem;
            color: #a45050;
            cursor: var(--kursor), pointer;
            text-align: left;
            display: flex;
            align-items: center;
            transition: color 0.1s;
        }
        .submenu-item::before {
            content: '>';
            margin-right: 10px;
        }
        .submenu-item:hover {
            color: #e56b6b;
        }

        .profile-icon {
            font-size: 3rem;
            margin-top: 15px;
            display: inline-block;
        }

        .content-area {
            flex: 1;
            height: 100%;
        }

        /* VIEW: DASHBOARD */
        #view-dashboard {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 25px;
            height: 100%;
        }

        .quest-log {
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
        }

        .quest-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
            overflow-y: auto;
            flex: 1;
            padding-right: 5px; /* For scrollbar */
        }

        /* Custom scrollbar for pixel look */
        .quest-grid::-webkit-scrollbar {
            width: 10px;
        }
        .quest-grid::-webkit-scrollbar-track {
            background: #ffc2b3;
            border: 2px solid #3d2626;
        }
        .quest-grid::-webkit-scrollbar-thumb {
            background: #3d2626;
        }

        .quest-item {
            background: rgba(255,255,255,0.6);
            border: 3px solid #3d2626;
            padding: 20px 10px;
            text-align: center;
            font-size: 0.65rem;
            line-height: 1.6;
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.1);
        }
        .quest-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .key-items {
            grid-row: 1 / 2;
        }
        .items-flex {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .item-slot {
            width: 70px;
            height: 70px;
            background: #ffc2b3;
            border: 4px solid #3d2626;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.15);
        }

        .save-data {
            grid-row: 2 / 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .save-text {
            font-size: 0.75rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .save-buttons {
            display: flex;
            gap: 15px;
        }
        .save-buttons button {
            flex: 1;
            font-size: 0.7rem;
            padding: 15px 10px;
        }

        /* VIEW: GALLERIES */
        #view-gallery-random, #view-gallery-romance, #view-gallery-photobooth {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .gallery-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 10px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Custom scrollbar for gallery grids */
        .gallery-grid::-webkit-scrollbar {
            width: 10px;
        }
        .gallery-grid::-webkit-scrollbar-track {
            background: #ffc2b3;
            border: 2px solid #3d2626;
        }
        .gallery-grid::-webkit-scrollbar-thumb {
            background: #3d2626;
        }
        .gallery-item {
            background-color: #ffc2b3;
            border: 4px solid #3d2626;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            cursor: var(--kursor), pointer;
            transition: transform 0.1s;
        }
        .gallery-item:hover {
            background-color: #ffcfc4;
            transform: scale(1.05);
        }


        /* ====== PANGGUNG (stage) untuk layar judul & password ====== */
        .stage {
            position: relative;
            /* selain dibatasi lebar layar, panggung juga dibatasi tingginya --
               kalau tidak, di layar pendek (HP dimiringkan) bagian bawahnya
               terpotong karena perbandingan sisinya 1024:516 */
            width: min(100vw, 1400px, calc(100vh * 1024 / 516));
            aspect-ratio: 1024/516;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            box-shadow: 0 0 20px #000;
            overflow: hidden;
        }

        /* ====== ANIMASI LAYAR JUDUL ====== */
        #ttl-adventure, #ttl-press {
            pointer-events: none;
        }
        #ttl-adventure {
            animation: ttlBob 1.6s step-end infinite;
        }
        @keyframes ttlBob {
            0%,   24.9% { transform: translateY(0); }
            25%,  49.9% { transform: translateY(-5%); }
            50%,  74.9% { transform: translateY(-9%); }
            75%, 100%   { transform: translateY(-5%); }
        }
        #ttl-press {
            animation: pressBlink 1.25s step-end infinite,
                       pressBob   1.6s  step-end infinite;
            animation-delay: 0s, 0.4s;
        }
        @keyframes pressBlink {
            0%,  72% { opacity: 1; }
            73%,100% { opacity: 0; }
        }
        @keyframes pressBob {
            0%,  49.9% { transform: translateY(0); }
            50%, 100%  { transform: translateY(-7%); }
        }
        /* tombol start disorot -> teks Press Start ikut menyala */
        #btn-start:hover ~ #ttl-press {
            filter: brightness(1.35) drop-shadow(0 0 6px rgba(255,220,180,0.9));
            opacity: 1;
            animation-name: pressBob;
            animation-duration: 1.6s;
        }
        #btn-start:hover ~ #ttl-adventure {
            filter: drop-shadow(0 0 8px rgba(255,200,160,0.6));
        }

        /* ====== PENJAGA GERBANG "BERNAPAS" (layar password) ====== */
        .guard {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            transform-origin: 50% 100%;
            animation: breathe 3.6s ease-in-out infinite;
        }
        #guard-right {
            animation-duration: 4.3s;
            animation-delay: -1.6s;
        }
        @keyframes breathe {
            0%, 100% { transform: scaleY(1); }
            45%      { transform: scaleY(1.016); }
        }

        /* GELEMBUNG DIALOG PENJAGA
           Anak elemen penjaga, jadi ikut posisi penjaga kiri/kanan tanpa
           dihitung di JS. Ubun-ubun helm ada di y 14% sel sprite dan kepala
           tepat di tengah sel, jadi ujung ekor gelembung ditaruh di
           (50%, 88% dari dasar). Tiap gambar gelembung beda lebarnya, jadi
           yang dipatok TINGGInya supaya ukuran tulisannya seragam; lebar
           mengikuti rasio gambar. Ujung ekor tiap gambar tidak persis di
           tengah -> disimpan di --ekor (dari JS) dan dipakai untuk
           menggeser gambar supaya ekornya yang jatuh di titik jangkar. */
        .guard-bubble {
            position: absolute;
            left: 50%;
            bottom: 88%;
            height: 38%;
            width: auto;
            --ekor: 50%;
            transform: translateX(calc(-1 * var(--ekor)));
            transform-origin: var(--ekor) 100%;
            image-rendering: pixelated;
            opacity: 0;
            pointer-events: none;
            z-index: 3;                     /* selalu di atas sprite penjaga */
        }
        /* muncul: memudar masuk + membesar sedikit dari bawah ke atas,
           ditahan, lalu memudar keluar. Satu animasi = sekaligus pewaktu. */
        .guard-bubble.tampil { animation: guardBubblePop 1.9s ease-out forwards; }
        @keyframes guardBubblePop {
            0%   { opacity: 0; transform: translateX(calc(-1 * var(--ekor))) translateY(18%) scale(0.55); }
            14%  { opacity: 1; transform: translateX(calc(-1 * var(--ekor))) translateY(-5%) scale(1.07); }
            24%  { opacity: 1; transform: translateX(calc(-1 * var(--ekor))) translateY(0)   scale(1); }
            76%  { opacity: 1; transform: translateX(calc(-1 * var(--ekor))) translateY(0)   scale(1); }
            100% { opacity: 0; transform: translateX(calc(-1 * var(--ekor))) translateY(-8%) scale(0.96); }
        }

        /* tombol menu tak terlihat di atas sidebar yang tergambar */
        .nav-btn {
            position: absolute;
            cursor: var(--kursor), pointer;
            pointer-events: auto;
            border-radius: 6px;
            transition: box-shadow 0.12s ease, background-color 0.12s ease;
        }
        .nav-btn:hover {
            background-color: rgba(255, 228, 180, 0.14);
            box-shadow: 0 0 0 2px rgba(255, 225, 180, 0.75), 0 0 14px rgba(255, 200, 140, 0.45);
        }
        .nav-btn.active {
            box-shadow: 0 0 0 2px rgba(255, 225, 180, 0.9), 0 0 16px rgba(255, 200, 140, 0.6);
        }
        /* ikon menu: PNG tersendiri, dipasang tepat di atas ikon mockup.
           Animasinya memakai scale saja supaya latar di bawahnya tak pernah tersingkap. */
        .nav-ico {
            position: absolute;
            pointer-events: none;
            transform-origin: 50% 50%;
            transition: transform 0.12s ease, filter 0.12s ease;
        }
        .nav-btn:hover .nav-ico {
            transform: scale(1.12);
            filter: brightness(1.2) drop-shadow(0 0 4px rgba(255, 210, 130, 0.7));
        }
        .nav-btn.active .nav-ico {
            filter: brightness(1.14) drop-shadow(0 0 4px rgba(255, 210, 130, 0.95));
            animation: icoPulse 1.7s ease-in-out infinite;
        }
        @keyframes icoPulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.08); }
        }

        #btn-logout:active, #btn-mute:active { transform: translateY(2px); }
        #btn-logout:hover {
            transform: translateX(-4px);
            filter: drop-shadow(0 0 8px rgba(255,225,180,0.9));
        }
        #btn-mute:hover {
            filter: drop-shadow(0 0 8px rgba(255,225,180,0.9));
        }

        /* transisi lembut saat berpindah layar / menu */
        #screen-title:not(.hidden), #screen-login:not(.hidden), #screen-main:not(.hidden) {
            animation: screenFade 0.35s ease-out;
        }
        @keyframes screenFade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .view-section:not(.hidden) {
            animation: viewFade 0.28s ease-out;
        }
        @keyframes viewFade {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        /* pemisah halus antar halaman galeri */
        .gallery-page::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            box-shadow: inset 0 10px 14px -8px rgba(0,0,0,0.85),
                        inset 0 -10px 14px -8px rgba(0,0,0,0.85);
        }

        /* tombol tak terlihat di atas gambar gerbang */
        .gate-btn {
            cursor: var(--kursor), pointer;
            z-index: 10;
            border-radius: 6px;
            transition: box-shadow 0.12s ease, transform 0.08s ease;
        }
        .gate-btn:hover {
            box-shadow: 0 0 0 2px rgba(255,225,180,0.75), 0 0 14px rgba(255,200,140,0.55);
        }
        .gate-btn:active {
            transform: translateY(2px);
        }

        #error-msg:not(.hidden) {
            animation: errShake 0.4s ease-in-out 2;
        }
        @keyframes errShake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-6px); }
            75%      { transform: translateX(6px); }
        }


        /* ====== KELOPAK BERJATUHAN (layar judul) ====== */
        .petal-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 6;
        }
        .petal-layer > i {
            display: block;
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 200%;
            background-repeat: repeat;
            will-change: transform;
        }
        .petal-far > i {
            background-image: url('gambarpixel/anim/petals_far.png');
            background-size: 17% 29%;
            opacity: 0.45;
            animation: petalFallFar 30s linear infinite;
        }
        .petal-near > i {
            background-image: url('gambarpixel/anim/petals_near.png');
            background-size: 24% 41%;
            opacity: 0.92;
            animation: petalFallNear 18s linear infinite;
        }
        @keyframes petalFallFar {
            from { transform: translateY(-29%); }
            to   { transform: translateY(0); }
        }
        @keyframes petalFallNear {
            from { transform: translateY(-41%); }
            to   { transform: translateY(0); }
        }

        /* ====== PENJAGA GERBANG: 2 frame (idle / menunduk) ====== */
        .guard {
            position: absolute;
            z-index: 2;
            /* bisa diklik/disentuh: seluruh kotak sprite jadi area sapaan */
            pointer-events: auto;
            cursor: var(--kursor), pointer;
            background-image: url('gambarpixel/anim/guard_sheet.webp');
            background-repeat: no-repeat;
            background-size: 200% 100%;
            transform-origin: 50% 100%;
            animation: breathe 3.6s ease-in-out infinite;
        }
        .guard-idle  { background-position: 0 0; }
        .guard-react { background-position: 100% 0; animation: none; }
        #guard-right {
            animation-duration: 4.3s;
            animation-delay: -1.6s;
        }

        /* ====== DASHBOARD: TREADMILL + KUDA JALAN ====== */
        .dash-scene {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }
        .dash-scene > i {
            display: block;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 300%;
            background-image: url('gambarpixel/anim/dash_loop_hi.webp');
            background-size: auto 100%;
            background-repeat: repeat-x;
            will-change: transform;
            animation: treadmill 50s linear infinite;
        }
        /* satu ubin (lanskap + cerminnya) = 56.55% dari lebar lapisan -> loop mulus */
        /* kuda menghadap kiri -> lanskap harus bergeser ke kanan supaya terlihat maju */
        @keyframes treadmill {
            from { transform: translateX(-56.55%); }
            to   { transform: translateX(0); }
        }

        .dash-horse {
            position: absolute;
            left: 50%;
            bottom: 9.5%;
            width: 33%;
            aspect-ratio: 683 / 706;
            transform: translateX(-50%);
            z-index: 2;
            background-image: url('gambarpixel/anim/horse_walk.webp');
            background-size: 300% 100%;
            background-repeat: no-repeat;
            animation: walkCycle 1.15s step-end infinite;
        }
        /* 3 frame -> 0% / 50% / 100% */
        @keyframes walkCycle {
            0%,      33.32% { background-position-x: 0%; }
            33.33%,  66.65% { background-position-x: 50%; }
            66.66%, 100%    { background-position-x: 100%; }

        /* bulan dipisah dari lanskap supaya tidak ikut bergerak (dan tidak dobel) */

        /* ====================================================================
           OVERLAY LOADING (transisi antar layar)
           ==================================================================== */
        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            overflow: hidden;
            background: #1b1033;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        #loading-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* langit bergulir ke kanan -> kuda terasa melaju ke kiri */
        .ld-sky {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        .ld-sky > i {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 200vw;
            height: 100%;
            background: url('gambarpixel/anim/loading_sky.webp') 0 0 / 100vw 100% repeat-x;
            animation: ldSky 9s linear infinite;
            will-change: transform;
        }
        @keyframes ldSky {
            from { transform: translateX(-100vw); }
            to   { transform: translateX(0); }
        }

        /* garis-garis kecepatan */
        .ld-speed {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            /* garis putus-putus mendatar, dipotong tipis lalu diredupkan di tepi layar */
            background: repeating-linear-gradient(90deg,
                rgba(255, 236, 200, 0) 0 110px,
                rgba(255, 236, 200, 0.34) 110px 190px,
                rgba(255, 236, 200, 0) 190px 300px);
            -webkit-mask-image:
                repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 52px),
                linear-gradient(180deg, transparent 24%, #000 40%, #000 76%, transparent 92%),
                linear-gradient(90deg, transparent 0, #000 18%, #000 82%, transparent 100%);
            -webkit-mask-composite: source-in;
            mask-image:
                repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 52px),
                linear-gradient(180deg, transparent 24%, #000 40%, #000 76%, transparent 92%),
                linear-gradient(90deg, transparent 0, #000 18%, #000 82%, transparent 100%);
            mask-composite: intersect;
            animation: ldStreak 0.85s linear infinite;
        }
        @keyframes ldStreak {
            from { transform: translateX(0); }
            to   { transform: translateX(300px); }
        }

        /* kuda berlari: sprite sheet 2 frame */
        .ld-horse {
            position: relative;
            z-index: 2;
            width: min(48vw, 620px);
            aspect-ratio: 935 / 699;
            background-image: url('gambarpixel/anim/gallop_sheet.webp');
            background-size: 200% 100%;
            background-repeat: no-repeat;
            animation: ldGallop 0.45s steps(2) infinite,
                       ldBob 0.45s ease-in-out infinite;
            filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.35));
        }
        @keyframes ldGallop {
            from { background-position-x: 0%; }
            to   { background-position-x: 200%; }
        }
        /* satu ayunan per langkah -> fase melayangnya terasa */
        @keyframes ldBob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-2%); }
        }
        /* Dulu di sini ada dua salinan kuda tembus pandang sebagai jejak
           kecepatan. Setelah gambarnya tajam, salinan itu terbaca sebagai
           kuda hantu, bukan gerakan -- jadi dihapus. Kesan lari sudah
           dibawa oleh garis kecepatan dan langit yang bergulir. */

        /* teks + titik berjalan */
        .ld-text {
            position: relative;
            z-index: 3;
            margin: 3vh 0 0;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.55rem, 1.5vw, 1rem);
            line-height: 1.8;
            color: #ffe9c8;
            text-shadow: 3px 3px 0 #2a1030;
            letter-spacing: 0.06em;
            text-align: center;
        }
        .ld-dots i {
            display: inline-block;
            opacity: 0;
            animation: ldDot 1.8s linear infinite;
        }
        .ld-dots i:nth-child(1) { animation-delay: 0s; }
        .ld-dots i:nth-child(2) { animation-delay: 0.15s; }
        .ld-dots i:nth-child(3) { animation-delay: 0.30s; }
        .ld-dots i:nth-child(4) { animation-delay: 0.45s; }
        .ld-dots i:nth-child(5) { animation-delay: 0.60s; }
        .ld-dots i:nth-child(6) { animation-delay: 0.75s; }
        @keyframes ldDot {
            0%,  4%   { opacity: 0; }
            8%,  55%  { opacity: 1; }
            60%, 100% { opacity: 0; }
        }

        /* ====================================================================
           KONTROL VOLUME
           ==================================================================== */
        #volume-ui {
            position: absolute;
            top: 3.4%;
            left: 8.5%;
            z-index: 50;
            pointer-events: auto;
            display: flex;
            align-items: center;

            padding: 0.35% 0.7%;

        @media (prefers-reduced-motion: reduce) {
            .ld-sky > i, .ld-speed, .ld-horse, .ld-horse::before, .ld-horse::after, .ld-dots i {
                animation: none !important;
            }
        }


        /* ====== ADEGAN BERLAPIS DI LAYAR JUDUL ======
           Pasangan tidak lagi menyatu di latar (latar memakai berkas yang
           bagian pasangannya sudah dihapus), jadi hanya ada SATU salinan --
           tidak mungkin tergambar ganda. Lapisan biasa dan lapisan tersenyum
           ditumpuk di kotak yang sama supaya pergantiannya tidak bergeser. */
        #hero-scene {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* ---- animasi masuk sinematik ----
           Hanya #ttl-art yang diberi animasi, dan isinya cuma lapisan gambar.
           Yang dianimasikan hanya transform dan opacity supaya tidak memicu
           perhitungan tata letak ulang. Kelasnya dicopot lagi setelah selesai
           (lihat JS) supaya lapisan tidak terus ditahan di memori grafis dan
           tidak menyisakan sisa transform. */
        #ttl-art {
            position: absolute;
            inset: 0;
        }
        #ttl-bg {
            position: absolute;
            inset: 0;
            background: url('gambarpixel/anim/title_bg_clean_hi.webp') center / cover no-repeat;
        }
        #ttl-art.masuk {
            animation: heroSettle 1.5s ease-out both;
        }
        @keyframes heroSettle {
            from { opacity: 0; transform: scale(1.05); }
            to   { opacity: 1; transform: scale(1); }
        }
        .cp-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .cp-smile {
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        #hero-scene.reacting .cp-smile { opacity: 1; }

        /* hati muncul di atas kepala mereka */
        #ttl-heart {
            position: absolute;
            /* tepat di celah antara kepala mereka: ubun-ubun ada di y 270,
               hati mengambang sedikit di atasnya */
            left: 48.24%;
            top: 45.9%;
            width: 3.4%;
            z-index: 3;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.45s cubic-bezier(0.2, 1.5, 0.4, 1);
        }
        #ttl-heart > i {
            display: block;
            width: 100%;
            padding-top: 92.5%;                 /* 222/240, mengikuti gambar hati */
            background: url('gambarpixel/anim/heart_pop.png') 0 0 / 100% 100% no-repeat;
        }
        #hero-scene.reacting #ttl-heart {
            opacity: 1;
            transform: translateY(0);
        }
        #hero-scene.reacting #ttl-heart > i {
            animation: heartFloat 2.6s ease-in-out 0.5s infinite;
        }
        @keyframes heartFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50%      { transform: translateY(-14%) scale(1.06); }
        }

        /* POHON + BURUNG BERTENGGER
           pohon.png dipasang sebagai lapisan sendiri menimpa pohon kiri yang
           menyatu di latar. Titik hinggapnya di-HARDCODE: px (535, 860) pada
           gambar 1024x1536 = permukaan atas dahan yang menonjol ke kanan.
           Burung dan gelembung adalah ANAK elemen pohon dan diposisikan dalam
           persen kotak pohon, jadi titik hinggapnya ikut ke mana pun pohon
           diskalakan -- bukan relatif ke panggung. Titik hinggap di dalam sel
           burung (px 344,452 dari 636x633) ditaruh tepat di titik itu. */
        #ttl-tree {
            position: absolute;
            left: -5.188%;
            top: -16.279%;
            width: 31.250%;
            aspect-ratio: 1024 / 1536;
            z-index: 3;
            background: url('gambarpixel/anim/pohon_burung.webp') 0 0 / 100% 100% no-repeat;
            pointer-events: none;
        }
        #ttl-tree > #ttl-bird {
            left: 36.928%;
            top: 42.572%;
            width: 28.320%;
            z-index: 2;                     /* di atas pohon, di bawah gelembung */
        }
        #ttl-bird {
            position: absolute;
            aspect-ratio: 636 / 633;
            background-image: url('gambarpixel/anim/bird_idle.webp');
            background-size: 200% 100%;
            background-repeat: no-repeat;
            transform-origin: 54.09% 71.41%;   /* titik hinggap di dalam sel */
        }
        /* hanya saat diam burung bisa disapa */
        #ttl-bird.diam { pointer-events: auto; cursor: var(--kursor), pointer; }
        #ttl-bird.bersiap { background-image: url('gambarpixel/anim/bird_preflight.webp'); background-size: 300% 100%; }
        #ttl-bird.terbang { background-image: url('gambarpixel/anim/bird_fly.webp');       background-size: 600% 100%;
                            animation: birdAway 2.4s ease-in forwards; }
        #ttl-bird.pulang  { background-image: url('gambarpixel/anim/bird_return.webp');    background-size: 400% 100%;
                            animation: birdBack 2.2s ease-out forwards; }
        #ttl-bird.pergi   { visibility: hidden; }
        /* pergi: melaju ke kanan di bawah tulisan, lalu naik keluar di sudut kanan atas
           (tulisan judul & PRESS START ada di x 31-69%, y 7-24% -- jalur ini
           tetap di bawahnya sampai lewat, baru menanjak) */
        @keyframes birdAway {
            0%   { transform: translate(0, 0) scale(1); }
            55%  { transform: translate(720%, -6%) scale(0.92); }
            100% { transform: translate(1150%, -420%) scale(0.7); }
        }
        /* pulang: masuk dari tepi kiri, meluncur turun ke dahan */
        @keyframes birdBack {
            0%   { transform: translate(-260%, -230%) scale(0.85); }
            70%  { transform: translate(-40%, -60%) scale(1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* gelembung "Cip cip~" -- pola yang sama dengan gelembung kucing */
        .bird-bubble {
            position: absolute;
            left: 54.116%;
            bottom: 51.673%;
            width: 45.898%;
            aspect-ratio: 1026 / 460;
            background: url('gambarpixel/anim/emote_burung.webp') 0 0 / 100% 100% no-repeat;
            transform: translateX(-49.95%);
            transform-origin: 49.95% 100%;
            opacity: 0;
            pointer-events: none;
            z-index: 3;                     /* selalu di atas burung */
        }
        .bird-bubble.tampil { animation: birdBubblePop 1.9s ease-out forwards; }
        @keyframes birdBubblePop {
            0%   { opacity: 0; transform: translateX(-49.95%) translateY(18%) scale(0.55); }
            14%  { opacity: 1; transform: translateX(-49.95%) translateY(-5%) scale(1.07); }
            24%  { opacity: 1; transform: translateX(-49.95%) translateY(0)   scale(1); }
            76%  { opacity: 1; transform: translateX(-49.95%) translateY(0)   scale(1); }
            100% { opacity: 0; transform: translateX(-49.95%) translateY(-8%) scale(0.96); }
        }

        /* KUCING - dua lembar terpisah
           jalan  : 6 frame, dipakai selama kucing bergerak
           menjilat: 12 frame, dipasang setelah sampai di dekat pasangan
           Kedua lembar disusun dengan UKURAN SEL YANG SAMA (319x272) dan kaki
           rata di dasar sel, jadi saat lembarnya ditukar kucing tidak
           meloncat. Frame digerakkan dari JS karena urutannya bercabang;
           perpindahan mendatarnya tetap transform CSS supaya ringan. */
        #ttl-cat {
            position: absolute;
            left: 0;
            top: 84.5%;
            width: 5.6%;
            aspect-ratio: 319 / 272;
            z-index: 5;
            background-image: url('gambarpixel/anim/cat_walk.webp');
            background-size: 600% 100%;
            background-repeat: no-repeat;
            animation: catCross 8s linear forwards;
            /* satu-satunya bagian adegan yang bisa diklik */
            pointer-events: auto;
            cursor: var(--kursor), pointer;
        }
        /* Gelembung ucapan. Dibuat sebagai ANAK elemen kucing, jadi ikut ke
           mana pun kucing bergerak tanpa perlu disinkronkan lewat JS --
           transform induknya (langkah maupun posisi diam) otomatis membawa
           gelembungnya. Ekor gelembung menunjuk ke kepala kucing, yang ada di
           sisi kanan sel karena kucing menghadap kanan. */
        .cat-bubble {
            position: absolute;
            left: 66%;
            bottom: 97%;
            width: 215%;
            aspect-ratio: 1361 / 657;
            background: url('gambarpixel/anim/emote_miaw.webp') 0 0 / 100% 100% no-repeat;
            /* ujung ekor gelembung ada di 48.27% lebar kanvas -> titik itu yang
               ditaruh tepat di atas kepala */
            transform: translateX(-48.27%);
            transform-origin: 48.27% 100%;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
        }
        .cat-bubble.tampil {
            animation: bubblePop 1.9s ease-out forwards;
        }
        /* muncul: memudar masuk + membesar sedikit dari bawah ke atas;
           tahan; lalu memudar keluar sendiri */
        @keyframes bubblePop {
            0%   { opacity: 0; transform: translateX(-48.27%) translateY(18%) scale(0.55); }
            14%  { opacity: 1; transform: translateX(-48.27%) translateY(-5%) scale(1.07); }
            24%  { opacity: 1; transform: translateX(-48.27%) translateY(0)   scale(1); }
            76%  { opacity: 1; transform: translateX(-48.27%) translateY(0)   scale(1); }
            100% { opacity: 0; transform: translateX(-48.27%) translateY(-8%) scale(0.96); }
        }
        /* berhenti di dekat pasangan lalu menjilat tangan di tempat */
        #ttl-cat.dandan {
            background-image: url('gambarpixel/anim/cat_groom.webp');
            background-size: 1200% 100%;
            animation: none;
            transform: translateX(620%);
        }
        @keyframes catCross {
            from { transform: translateX(-130%); }
            to   { transform: translateX(620%); }
        }

        /* Napas pasangan di layar judul.
           Lapisan ini memakai BERKAS LATAR YANG SAMA, bukan potongan
           tersendiri: gambarnya diskalakan persis seukuran panggung
           (100/0,25586 = 390,84% dan 100/0,47868 = 208,91%) lalu digeser
           supaya yang tampak hanya bagian pasangan. Dengan begitu Chrome
           memakai hasil rasterisasi yang sama dengan latar, jadi
           ketajamannya identik -- kalau memakai berkas sendiri, lapisannya
           terlihat lebih lembut daripada sekelilingnya.
           Tepi atas dan samping dilembutkan mask supaya sambungan dengan
           latar tetap tak terlihat saat lapisan diregangkan; bagian bawah
           dibiarkan utuh karena titik tumpu skala ada di sana. */
        #ttl-couple {
            position: absolute;
            /* letaknya diukur dengan pencocokan pola terhadap latar:
               x 394, y 265, 242x206 pada gambar 1024x516 */
            left: 38.477%;
            top: 51.357%;
            width: 23.633%;
            height: 39.922%;
            z-index: 2;
            transform-origin: 50% 100%;
            animation: coupleBreath 4.4s ease-in-out infinite;
        }
        @keyframes coupleBreath {
            0%   { transform: scaleY(1); }
            36%  { transform: scaleY(1.007); }
            78%  { transform: scaleY(1.0008); }
            100% { transform: scaleY(1); }
        }

        }
        .au-rows > div { display: flex; flex-direction: column; align-items: flex-start; }
        .au-chip {
            display: inline-block;
            padding: 0.34em 0.62em;
            background: #5d3a2a;
            border: 2px solid #c69a63;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.4rem, 0.82vw, 0.72rem);
            color: #ffdca8;
            text-shadow: 1px 1px 0 #2b1a12;
            letter-spacing: 0.03em;
        }
        .au-val {
            margin: 0.35em 0 0;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.4rem, 0.86vw, 0.74rem);
            line-height: 1.6;
            color: #f1e6d2;
            text-shadow: 2px 2px 0 #241a14;
        }

        /* halaman 2-4: dua slot */
        .au-slots {
            position: absolute;
            inset: 0;
        }
        /* posisi mengikuti bingkai slot yang tergambar di frame_two_slots.png */
        .au-slots .au-chip,
        .au-slots .au-val {
            position: absolute;
            transform: translateX(-50%);
            text-align: center;
            white-space: nowrap;
        }
        .au-slots .au-chip { top: 27.5%; }
        .au-slots .au-val  { top: 81.5%; margin: 0; }
        .au-c1 { left: 29.47%; }
        .au-c2 { left: 71.74%; }
        .au-slot-box {
            position: absolute;
            top: 40.65%;
            height: 32.9%;
            /* bagian dalam slot tembus pandang -> beri alas agar ikon konsisten */
            background: rgba(30, 41, 29, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .au-b1 { left: 16.91%; width: 25.12%; }
        .au-b2 { left: 58.94%; width: 25.60%; }
        .au-slot-box img {
            max-width: 96%;
            max-height: 96%;
            width: auto;
            height: auto;
            filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.45));
            transition: transform 0.15s ease;
        }
        .au-slot-box:hover img {
            transform: scale(1.08) translateY(-3px);
            filter: drop-shadow(0 0 8px gold);
        }
        /* foto berbingkai ikut berkilau saat disorot */
        .slot-photo,
        .photobooth-img {
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .slot-photo:hover,
        .photobooth-img:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 8px gold);
            z-index: 20;
        }
        .au-portrait { transition: filter 0.15s ease; }
        .au-pbox:hover .au-portrait { filter: drop-shadow(0 0 8px gold); }
        /* ikon sumbernya jauh lebih besar dari ukuran tampil; diperkecil dengan
           penyaringan halus supaya tidak pecah bergerigi */
        .au-slot-box img { image-rendering: auto; }

        /* ---- navigasi halaman ---- */
        .au-pager {
            display: flex;
            align-items: center;
            gap: 1.2%;
        }
        .au-pg {
            height: clamp(20px, 3.4vw, 42px);
            width: auto;
            cursor: var(--kursor), pointer;
            transition: transform 0.1s ease, filter 0.12s ease;
        }
        .au-num { filter: brightness(0.72) saturate(0.5); }
        .au-pg:hover { transform: translateY(-2px); filter: brightness(1.1) saturate(0.9); }
        .au-pg.active,
        .au-num.active {
            filter: brightness(1.3) saturate(1.15) drop-shadow(0 0 6px rgba(255, 210, 130, 0.95));
            transform: scale(1.12);
        }
        .au-pg.off { opacity: 0.35; cursor: var(--kursor), default; pointer-events: none; }
        .au-switch {
            padding: 0.7em 1.1em;
            background: #5d3a2a;
            border: 2px solid #c69a63;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.38rem, 0.72vw, 0.64rem);
            color: #ffdca8;
            text-shadow: 1px 1px 0 #2b1a12;
            cursor: var(--kursor), pointer;
            user-select: none;
            letter-spacing: 0.05em;
            transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.1s ease;
        }
        .au-switch:hover {
            background: #7a4a38;
            border-color: #ffd28a;
            color: #fff3d6;
            transform: translateY(-2px);
        }
        .au-switch:active { transform: translateY(1px); }

        /* Label menu About Us di sidebar; yang lain sudah tergambar di mockup.
           Press Start 2P jauh lebih lebar per hurufnya, jadi kalau tingginya
           disamakan teksnya melimpah keluar papan. Pixelify Sans proporsinya
           mendekati huruf yang tergambar di mockup (tinggi huruf 'h' dan
           perbandingan tinggi 'o' terhadapnya hampir sama). */
        .nav-label {
            position: absolute;
            left: 38%;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Pixelify Sans', 'Press Start 2P', monospace;
            font-size: clamp(0.62rem, 1.7vw, 1.55rem);
            line-height: 1.15;
            color: #d9dcc4;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.65);
            pointer-events: none;
            white-space: nowrap;
        }

        /* ====================================================================
           TAMAN: pohon sakura yang dirawat (menu baru di sidebar kiri)
           ==================================================================== */
        #view-taman { overflow: hidden; background: #1a1533; }
        #tm-canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
        .tm-hud {
            position: absolute; left: 3%; top: 4%; width: 44%;
            padding: 2.2% 2.6%;
            background: rgba(20, 15, 32, 0.78);
            border: 3px solid #8b5a2b; border-radius: 6px;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5), 3px 3px 0 rgba(0,0,0,0.45);
            font-family: 'Pixelify Sans', 'Press Start 2P', monospace;
            font-size: clamp(0.42rem, 1.05vw, 1rem);
            color: #f3e6d0;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.7);
        }
        .tm-judul { margin: 0 0 0.5em; font-size: 1.25em; color: #ffd1de; }
        .tm-baris { display: flex; justify-content: space-between; margin-bottom: 0.25em; }
        .tm-bar { height: 0.7em; background: #2b2238; border: 2px solid #120d1c; margin-bottom: 0.7em; }
        .tm-bar > i { display: block; height: 100%; transition: width 0.6s ease, background-color 0.6s ease; }
        #tm-air { background: #5aa9e8; }
        #tm-air.kering { background: #e2504a; }
        #tm-tumbuh { background: #f08ab0; }
        .tm-tombol { display: flex; gap: 6%; margin-top: 0.2em; }
        .tm-tombol button {
            flex: 1;
            font: inherit; font-size: 1.05em;
            padding: 0.45em 0;
            color: #4a3b2c; background: #e8d0aa;
            border: 3px solid #8b5a2b; border-radius: 4px;
            box-shadow: inset -2px -2px 0 #c9a979, inset 2px 2px 0 #fff1d6;
            cursor: var(--kursor), pointer;
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        .tm-tombol button:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .tm-tombol button:active { transform: translateY(2px); box-shadow: inset 2px 2px 0 #c9a979; }
        #tm-msg { margin: 0.7em 0 0; min-height: 1.2em; color: #e7d8bd; }

        /* ====== PEMUTAR MUSIK (posisi tetap di layar) ====== */
        #music-bar {
            position: fixed;
            right: 20px;
            top: 20px;
            z-index: 120;
            display: flex;
            align-items: center;
            gap: 0.8vw;
            padding: 0.45vw 0.9vw;
            background: rgba(28, 20, 16, 0.72);
            border: 2px solid rgba(246, 231, 200, 0.75);
            border-radius: 4px;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
        }
        .mus-btn {
            height: clamp(20px, 2.1vw, 34px);
            width: auto;
            cursor: var(--kursor), pointer;
            user-select: none;
            transition: transform 0.1s ease, filter 0.12s ease;
        }
        #btn-play { height: clamp(28px, 3vw, 48px); }
        /* Harpa berdenyut selama lagu berjalan. Yang dianimasikan hanya
           cahayanya, bukan ukurannya -- tombol yang terus berubah besar
           membuat sasaran kliknya bergeser terus. */
        #btn-play.main { animation: lutePulse 1.5s ease-in-out infinite; }
        @keyframes lutePulse {
            0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 210, 130, 0))   brightness(1); }
            50%      { filter: drop-shadow(0 0 8px rgba(255, 210, 130, 0.95)) brightness(1.15); }
        }
        .mus-btn:hover {
            transform: scale(1.12);
            filter: brightness(1.2) drop-shadow(0 0 5px rgba(255, 210, 130, 0.8));
        }
        .mus-btn:active { transform: scale(1.02) translateY(2px); }
        /* saat dijeda, harpa diredupkan */
        #btn-play.jeda { filter: grayscale(0.65) brightness(0.62); }
        #btn-play.jeda:hover { filter: grayscale(0.2) brightness(1.05); }
        #mus-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.3rem, 0.58vw, 0.5rem);
            color: #ffdca8;
            text-shadow: 1px 1px 0 #2b1a12;
            max-width: 11vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ====== LIGHTBOX FOTO ====== */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(15, 8, 12, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: screenFade 0.2s ease-out;
        }
        #lightbox img {
            max-width: 78vw;
            max-height: 82vh;
            image-rendering: auto;
            border: 6px solid #f6e7c8;
            box-shadow: 0 0 0 4px #3d2626, 0 10px 40px rgba(0,0,0,0.8);
            background: #f6e7c8;
        }
        .lb-btn {
            position: absolute;
            font-family: 'Press Start 2P', monospace;
            color: #ffe9c8;
            background: rgba(61, 38, 38, 0.85);
            border: 3px solid #f6e7c8;
            padding: 14px 16px;
            cursor: var(--kursor), pointer;
            user-select: none;
            font-size: 0.9rem;
            line-height: 1;
            transition: background-color 0.12s ease, transform 0.08s ease;
        }
        .lb-btn:hover { background: rgba(120, 70, 70, 0.95); }
        .lb-btn:active { transform: translateY(2px); }
        #lb-prev  { left: 3vw; top: 50%; transform: translateY(-50%); }
        #lb-next  { right: 3vw; top: 50%; transform: translateY(-50%); }
        #lb-close { right: 3vw; top: 4vh; }
        #lb-count {
            position: absolute;
            bottom: 4vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            color: #ffe9c8;
            text-shadow: 2px 2px 0 #000;
        }

        /* ====== HALAMAN GALERI (hanya bagian tengah yang ikut bergulir) ====== */
        .gallery-page {
            position: relative;
            width: 100%;
            height: 33.3333%;
            /* sumbernya sudah di-upscale NN x6, jadi browser tinggal mengecilkan:
               tepi piksel tetap tegas tanpa blok besar yang tidak rata */
            image-rendering: auto;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }
        .slot-photo {
            position: absolute;
            object-fit: cover;
            object-position: 50% 32%;
            image-rendering: auto;
            border: 2px solid #f6e7c8;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.5);
            cursor: var(--kursor), pointer;
            transition: filter 0.15s ease, box-shadow 0.15s ease;
        }
        .slot-photo:hover {
            filter: brightness(1.08) saturate(1.05);
            box-shadow: 0 0 10px rgba(255,225,180,0.85);
        }

        @media (prefers-reduced-motion: reduce) {
            #ttl-adventure, #ttl-press, .guard { animation: none !important; }
        }

        .photobooth-img {
            width: 100%;
            height: auto;
            image-rendering: auto;
            border: 3px solid #f6e7c8;
            border-radius: 4px;
            box-shadow: 2px 3px 8px rgba(0,0,0,0.6);
            cursor: var(--kursor), pointer;
            transition: filter 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
        }
        .photobooth-img:hover {
            filter: brightness(1.08);
            transform: scale(1.03);
            box-shadow: 0 0 12px rgba(255,225,180,0.85);
        }

        /* ==================================================================
           TATA LETAK LAYAR KECIL (HP) - sengaja ditaruh paling bawah supaya
           aturannya menimpa yang di atas.
           ================================================================== */
        @media (max-width: 768px) {
            /* --- alur menyamping dijadikan menurun --- */
            .main-container {
                flex-direction: column;
                height: auto;
                gap: 16px;
            }
            .sidebar { flex: 0 0 auto; }
            #view-profile > div {
                flex-direction: column;
                align-items: center;
                gap: 18px;
                padding: 6vw;
                width: 90%;
            }
            #view-profile > div > div { width: 90%; }

            /* --- lebar tetap dijadikan relatif --- */
            #screen-login .pixel-box { width: 90%; max-width: 450px; }
            .item-slot { width: 18vw; height: 18vw; max-width: 70px; max-height: 70px; }
            #screen-main { padding: 12px; }
            .au-choice img { height: clamp(44px, 11vw, 96px); }
            /* --- huruf ikut menyusut bersama panggungnya ---
               batas bawah clamp diturunkan; kalau tidak, huruf tetap
               berukuran layar besar dan meluber keluar kotaknya. */
            .au-title  { font-size: clamp(0.34rem, 1.05vw, 0.95rem); }
            .au-chip   { font-size: clamp(0.28rem, 0.82vw, 0.72rem); padding: 0.3em 0.45em; border-width: 1px; }
            .au-val    { font-size: clamp(0.3rem, 0.86vw, 0.74rem); }
            .au-switch { font-size: clamp(0.28rem, 0.72vw, 0.64rem); padding: 0.5em 0.8em; border-width: 1px; }
            .au-select-title { font-size: clamp(0.4rem, 1.3vw, 1.1rem); }
            .nav-label { font-size: clamp(0.34rem, 1.7vw, 1.55rem); }
            #vol-label { font-size: clamp(0.3rem, 0.75vw, 0.6rem); }

            /* --- pemutar musik dipindah ke tengah bawah biar mudah dijangkau --- */
            #music-bar {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                top: 8px;
                gap: 10px;
                padding: 6px 12px;
            }
            .mus-btn { height: 26px; }
            #btn-play { height: 36px; }
            #mus-title { max-width: 38vw; font-size: 0.42rem; }
        }

        /* HP dalam posisi tegak: tampilan ini bentuknya memanjang ke samping
           (1024x516), jadi kalau dipaksa muat di layar tegak semuanya jadi
           mungil. Lebih jujur meminta layar diputar. */
        #rotate-hint {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5vw;
            padding: 8vw;
            text-align: center;
            background: #14100e;
            color: #f3e7cf;
            font-family: 'Press Start 2P', monospace;
        }
        #rotate-hint .rh-ikon {
            width: 22vw;
            max-width: 130px;
            animation: rhPutar 2.4s ease-in-out infinite;
        }
        #rotate-hint p { margin: 0; font-size: 3.4vw; line-height: 2; }
        #rotate-hint small { font-size: 2.6vw; color: #cbbfa6; line-height: 1.9; }
        #rotate-hint .rh-lanjut {
            margin-top: 2vw;
            padding: 0.8em 1.2em;
            font-family: inherit;
            font-size: 2.6vw;
            color: #ffdca8;
            background: #5d3a2a;
            border: 2px solid #c69a63;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
            cursor: var(--kursor), pointer;
        }
        @keyframes rhPutar {
            0%, 45%   { transform: rotate(0deg); }
            70%, 100% { transform: rotate(90deg); }
        }
        /* layar pendek -- biasanya HP yang dimiringkan. Lebarnya bisa lebih
           dari 768 px jadi tidak kena blok di atas, tapi tetap sempit. */
        @media (max-height: 520px) {
            #music-bar {
                left: 4px;
                right: auto;
                transform: none;
                top: 4px;   /* kanan atas dipakai panel volume saat layar pendek */
                gap: 8px;
                padding: 4px 8px;
            }
            .mus-btn { height: 20px; }
            #btn-play { height: 28px; }
            #mus-title { max-width: 26vw; font-size: 0.38rem; }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            body:not(.abaikan-putar) #rotate-hint { display: flex; }
        }
</style>
</head>
<body>

    <!-- WADAH 1: TITLE SCREEN -->
    <div id="screen-title" class="active full-screen-container" style="background: #111; display: flex; justify-content: center; align-items: center;">
        <div class="stage" id="title-stage">

            <!-- Area klik START (ditaruh lebih dulu supaya bisa menyorot teks di bawahnya) -->
            <div id="btn-start" style="position: absolute; top: 14.5%; left: 36%; width: 28%; height: 13%; cursor: var(--kursor), pointer; z-index: 10;"></div>

            <!-- Judul & PRESS START dipisah dari background supaya bisa bergerak -->
            <img id="ttl-press" src="gambarpixel/anim/press_hi.png" alt="Press Start"
                 style="position: absolute; left: 41.309%; top: 18.217%; width: 18.164%; height: 5.62%; z-index: 5;">
            <img id="ttl-adventure" src="gambarpixel/anim/title_hi.png" alt="Our Adventure"
                 style="position: absolute; left: 31.055%; top: 7.752%; width: 37.988%; height: 9.69%; z-index: 5;">

            <!-- Adegan berlapis: kucing lewat -> pasangan menoleh & tersenyum -> hati muncul -->
            <div id="hero-scene">
                <!-- HANYA lapisan gambar yang masuk ke sini: latar + sosok
                     pasangan. Teks, tombol, hati, dan kucing sengaja di luar
                     supaya tidak ikut diskalakan (bikin buram & geser). -->
                <div id="ttl-art">
                    <div id="ttl-bg"></div>
                    <div id="ttl-couple">
                        <img class="cp-frame" src="gambarpixel/anim/couple_calm.webp" alt="Ksatria dan tuan putri">
                        <img class="cp-frame cp-smile" src="gambarpixel/anim/couple_smile.webp" alt="">
                    </div>
                </div>
                <div id="ttl-heart"><i></i></div>
                <div id="ttl-cat" title="Elus kucingnya"><i class="cat-bubble"></i></div>
                <!-- pohon sebagai lapisan sendiri; burung dan gelembungnya ANAK pohon,
                     jadi keduanya ikut titik hinggap dahan di ukuran layar apa pun -->
                <div id="ttl-tree">
                    <div id="ttl-bird" title="Sapa burungnya"></div>
                    <i class="bird-bubble"></i>
                </div>
            </div>

            <!-- kelopak bunga berjatuhan (2 lapis, beda kecepatan) -->
            <div class="petal-layer petal-far" style="z-index: 3;"><i></i></div>
            <div class="petal-layer petal-near" style="z-index: 4;"><i></i></div>
        </div>
    </div>

    <!-- WADAH 2: LOGIN MODAL -->
    <div id="screen-login" class="hidden full-screen-container" style="background: #111; display: flex; justify-content: center; align-items: center;">
        <div class="stage" style="background-image: url('gambarpixel/anim/pw_bg_hi.webp');">

            <!-- Penjaga gerbang: sprite sheet 2 frame (idle / menunduk saat mengetik) -->
            <div class="guard guard-idle" id="guard-left" title="Sapa penjaganya"
                 style="left: 17.349%; top: 29.210%; width: 13.272%; height: 48.128%;"><img class="guard-bubble" alt=""></div>
            <div class="guard guard-idle" id="guard-right" title="Sapa penjaganya"
                 style="left: 71.158%; top: 29.210%; width: 13.272%; height: 48.128%;"><img class="guard-bubble" alt=""></div>

            <!-- Invisible input field positioned exactly over the baked-in stars -->
        <input type="password" id="password-input" class="login-input" maxlength="10" style="position: absolute; top: 59.9%; left: 42.09%; width: 15.92%; height: 5.0%; padding: 0 1%; line-height: 1; background: #4e3132; border: none; border-radius: 4px; color: #f7e0b0; text-align: center; font-size: clamp(0.34rem, 0.86vw, 0.72rem); outline: none; caret-color: #f7e0b0; z-index: 10; letter-spacing: 0.14em; text-shadow: 2px 2px 0 rgba(0,0,0,0.55); box-shadow: inset 0 2px 4px rgba(0,0,0,0.45);">

        <!-- Invisible click target for SUBMIT -->
        <div id="btn-login" class="gate-btn" style="position: absolute; top: 67.1%; left: 40.9%; width: 8.54%; height: 5.81%;"></div>
        <!-- Invisible click target for CANCEL -->
        <div id="btn-cancel" class="gate-btn" style="position: absolute; top: 67.1%; left: 50.4%; width: 8.67%; height: 5.81%;"></div>

        <p id="error-msg" class="error-message hidden" style="position: absolute; bottom: 8%; width: 100%; text-align: center; color: #ff6b6b; text-shadow: 2px 2px #000; font-size: clamp(0.7rem, 1.6vw, 1rem); z-index: 10;">KODE SALAH!</p>
        </div>
    </div>

    <!-- WADAH 3: MAIN DASHBOARD -->
    <div id="screen-main" class="hidden full-screen-container" style="background: #2b2b2b; display: flex; justify-content: center; align-items: center;">
        <!-- The main container now uses the original 1024x516 mockup dashboard as its pristine background -->
        <div id="dashboard-wrapper" style="position: relative; width: min(100vw, 1400px, calc(100vh * 1024 / 516)); aspect-ratio: 1024/516; box-shadow: 0 0 20px #000; overflow: hidden;">
            <div id="scrolling-bg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('gambarpixel/anim/dashboard_hi.webp') top left / 100% 100% no-repeat; z-index: 0; transition: background-image 0.3s ease;"></div>

            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;">
                <!-- Re-enable pointer events for interactive areas -->
                <style>
                    #main-content-area { pointer-events: auto; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
                    #main-content-area::-webkit-scrollbar { display: none; }
                    .sidebar-interactive { pointer-events: auto; }
            
    </style>


            <!-- KONTROL VOLUME -->

        document.addEventListener('DOMContentLoaded', () => {

            const loadingOverlay = document.getElementById('loading-overlay');
            const allScreens = [screenTitle, screenLogin, screenMain];
            const FADE_MS = 350;
            const HOLD_MS = 2500;
            let transitionBusy = false;

            let transitionSeq = 0;

            function triggerTransition(targetScreenId, onArrive) {
                if (transitionBusy) return;
                transitionBusy = true;
                const seq = ++transitionSeq;

                // 1. munculkan overlay
                loadingOverlay.classList.remove('hidden');
                loadingOverlay.setAttribute('aria-hidden', 'false');
                requestAnimationFrame(() => loadingOverlay.classList.add('show'));

                // 2. tahan 2500 ms
                setTimeout(() => {
                    // 3. sembunyikan semua layar, tampilkan tujuannya
                    allScreens.forEach(s => {
                        s.classList.add('hidden');
                        s.classList.remove('active');
                    });
                    const target = document.getElementById(targetScreenId);
                    if (target) {
                        target.classList.remove('hidden');
                        target.classList.add('active');
                    }
                    if (typeof onArrive === 'function') onArrive();

                    // 4. hilangkan overlay. Kunci dilepas begitu layar tujuan
                    //    tampil -- kalau menunggu animasi pudar selesai, klik
                    //    dalam 350 ms pertama akan hilang tanpa jejak.
                    transitionBusy = false;
                    loadingOverlay.classList.remove('show');
                    setTimeout(() => {
                        if (seq !== transitionSeq) return;   // sudah ada transisi baru
                        loadingOverlay.classList.add('hidden');
                        loadingOverlay.setAttribute('aria-hidden', 'true');
                    }, FADE_MS);
                }, HOLD_MS);
            }

            // 1. Aksi Title Screen ke Login

                    screenLogin.classList.add('hidden');

                    screenTitle.classList.remove('hidden');

            // 2. Aksi Login Validasi
            const attemptLogin = () => {
                if (inputPassword.value === '01052026') {

            btnLogin.addEventListener('click', attemptLogin);

            let guardTimer = null;
            const guardPeek = () => {
                setGuard(true);
                clearTimeout(guardTimer);
                guardTimer = setTimeout(() => setGuard(false), 1400);
            };
            inputPassword.addEventListener('input', guardPeek);
            inputPassword.addEventListener('keydown', guardPeek);
            inputPassword.addEventListener('blur', () => { clearTimeout(guardTimer); setGuard(false); });

            // ---- penjaga diklik/disentuh -> gelembung dialog acak di atas kepalanya ----
            // Tiap penjaga punya kumpulan gelembung dan keadaan sendiri (satu

            // mengganggu. Animasinya sekaligus pewaktu: klik bertubi-tubi pada

            guards.forEach(g => {

                const CH = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
                const SW = 46, SH = 38, S = 6, AW = 120;
                const LEAF = new Set(D.leaf);
                function decode(e) {
                    const [k, b] = e.split('|'), rows = [];

                    for (let r of b.split('/')) {
                        r = r.replace(/\((\d+)\)/g, (m, n) => '.'.repeat(+n));

                    while (rows.length < SH) rows.unshift('.'.repeat(SW));
                    return Array.from(rows.slice(-SH).join(''), c => c === '.' ? -1 : CH.indexOf(c));

                        const c = cp[Math.random() * cp.length | 0];
                        parts.push({ k: 'p', x: TX + c[0] + bendAt(c[1] * S, cur, A) / S, y: TY + c[1], vx: .6 + Math.random() * .8, vy: 3 + Math.random() * 2.5, ph: Math.random() * 6.28, c: pink ? D.petals[Math.random() * D.petals.length | 0] : D.wilt[Math.random() * 10 | 0], land: 0 });
                    }
                    if (!rate) petalT = 0;
                    for (let i = parts.length - 1; i >= 0; i--) {
                        const p = parts[i];
                        if (p.k === 'd') {           // tetes air
                            p.vy += 60 * dt; p.y += p.vy * dt;
                            x.globalAlpha = Math.max(0, Math.min(1, (GY - p.y) / 3)); x.fillStyle = '#9ccdf5';
                            x.fillRect(Math.round(p.x * S), Math.round(p.y * S), 3, 8); x.globalAlpha = 1;
                            if (p.y >= GY - .5) { parts.splice(i, 1); for (let j = 0; j < 2; j++) parts.push({ k: 'sp', x: p.x, y: GY - .5, vx: (Math.random() - .5) * 8, vy: -6 - Math.random() * 4, l: .35 }); }
                            continue;
                        }
                        if (p.k === 'sp') {          // percikan
                            p.vy += 40 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt;
                            x.globalAlpha = Math.max(0, p.l / .35); x.fillStyle = '#bfe0fa';
                            x.fillRect(Math.round(p.x * S), Math.round(p.y * S), 3, 3); x.globalAlpha = 1;
                            if (p.l <= 0) parts.splice(i, 1);
                            continue;
                        }
                        if (p.k === 'db') {          // debu langkah
                            p.l -= dt; p.r += dt * 2.2; p.x += p.vx * dt; p.y -= dt * .8;
                            x.globalAlpha = Math.max(0, p.l / p.L) * .45; x.fillStyle = '#b8a48c';
                            x.beginPath(); x.arc(p.x * S, p.y * S, p.r * S, 0, Math.PI * 2); x.fill(); x.globalAlpha = 1;
                            if (p.l <= 0) parts.splice(i, 1);
                            continue;
                        }
                        if (p.k === 's') {           // kilau pupuk
                            p.y -= 7 * dt; p.l -= dt;
                            x.globalAlpha = Math.sin(Math.max(0, Math.min(1, p.l / p.L)) * Math.PI); x.fillStyle = '#ffe58a';
                            const X = Math.round((p.x + Math.sin(T * 3 + p.ph) * .6) * S), Y = Math.round(p.y * S);

                            if (p.l <= 0) parts.splice(i, 1);
                            continue;
                        }
