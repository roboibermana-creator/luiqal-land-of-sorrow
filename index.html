                        dur = m ? 1.0 : 0.6;
                        const f0 = m ? 380 : 480, fp = m ? 620 : 900;
                        osc.frequency.setValueAtTime(f0, t);
                        osc.frequency.linearRampToValueAtTime(fp, t + dur * 0.35);
                        osc.frequency.linearRampToValueAtTime(m ? 330 : 420, t + dur);
                        filt.frequency.setValueAtTime(700, t);
                        filt.frequency.linearRampToValueAtTime(2200, t + dur * 0.35);
                        filt.frequency.linearRampToValueAtTime(900, t + dur);
                        gain.gain.setValueAtTime(0, t);
                        gain.gain.linearRampToValueAtTime(0.35 * v, t + 0.06);
                        gain.gain.linearRampToValueAtTime(0.25 * v, t + dur * 0.6);
                        gain.gain.linearRampToValueAtTime(0, t + dur);
                    }
                    osc.start(t); osc.stop(t + dur);
                }

                ttlCat.addEventListener('click', () => {
                    const pilih = emote[Math.floor(Math.random() * emote.length)];
                    suaraKucing(pilih);
                    // lompat: lembar cat_jump (6 frame) dimainkan sinkron dengan
                    // lengkung naik-turun. Lengkungnya pakai properti `translate`
                    // (terpisah dari `transform` yang dipakai langkah kucing), jadi
                    // tidak saling menimpa dan gelembung ikut naik karena anak elemen.
                    // Frame dipilih dari currentTime animasinya sendiri, jadi
                    // sprite dan gerak selalu seirama. Setelah mendarat, lembar
                    // sebelumnya (jalan/menjilat) dipulihkan.
                    if (!ttlCat.getAnimations().some(a => a.id === 'lompat')) {
                        const LOMPAT_MS = 700;
                        // batas akhir tiap frame (fraksi durasi): jongkok, tolak, puncak, turun, mendarat, pulih
                        const batas = [0.14, 0.30, 0.52, 0.72, 0.88, 1];
                        catLompat = true;
                        ttlCat.style.backgroundImage = "url('gambarpixel/anim/cat_jump.webp')";
                        ttlCat.style.backgroundSize = '600% 100%';
                        const lompat = ttlCat.animate([
                            { translate: '0 0',     easing: 'ease-out' },
                            { translate: '0 0',     offset: 0.14, easing: 'cubic-bezier(.2,.7,.4,1)' },
                            { translate: '0 -75%',  offset: 0.45, easing: 'cubic-bezier(.6,0,.8,.4)' },
                            { translate: '0 0',     offset: 0.78 },
                            { translate: '0 0' }
                        ], { duration: LOMPAT_MS });
                        lompat.id = 'lompat';
                        const putar = () => {
                            const p = Math.min(1, (lompat.currentTime || 0) / LOMPAT_MS);
                            const f = batas.findIndex(x => p <= x);
                            ttlCat.style.backgroundPositionX = (f * 100 / 5) + '%';
                            if (p < 1 && lompat.playState === 'running') requestAnimationFrame(putar);
                        };
                        putar();
                        lompat.onfinish = lompat.oncancel = () => {
                            catLompat = false;
                            ttlCat.style.backgroundImage = '';
                            ttlCat.style.backgroundSize = '';
                            catGambar();
                        };
                    }
                    bubble.style.backgroundImage = "url('gambarpixel/anim/emote_" + pilih + ".webp')";
                    bubble.classList.remove('tampil');
                    void bubble.offsetWidth;          // paksa hitung ulang supaya animasi mulai dari awal
                    bubble.classList.add('tampil');
                });
                bubble.addEventListener('animationend', () => bubble.classList.remove('tampil'));
            }

            // ---- BURUNG BERTENGGER: diam -> (klik) bersiap -> terbang -> pergi -> pulang -> diam ----
            const ttlBird = document.getElementById('ttl-bird');
            if (ttlBird) {
                const birdBubble = document.querySelector('#ttl-tree .bird-bubble');
                const BIRD = {                       // frame per lembar & jeda antar frame
                    diam:    { n: 2, ms: 480 },
                    bersiap: { n: 3, ms: 170 },
                    terbang: { n: 6, ms: 80  },
                    pulang:  { n: 4, ms: 150 },
                };
                const KELAS = ['diam', 'bersiap', 'terbang', 'pergi', 'pulang'];
                let birdState = 'diam', birdIdx = 0, birdTimer = null;

                function birdGambar(n) {
                    ttlBird.style.backgroundPositionX = (birdIdx * 100 / (n - 1)) + '%';
                }
                function birdSet(state) {
                    clearTimeout(birdTimer);
                    birdState = state; birdIdx = 0;
                    KELAS.forEach(k => ttlBird.classList.toggle(k, k === state));
                    if (state !== 'pergi') birdGambar(BIRD[state].n);
                }
                // satu pengatur waktu untuk semua keadaan; tiap keadaan tahu
                // sendiri harus berputar atau berhenti di frame terakhir
                function birdDetak() {
                    const s = birdState;
                    if (s === 'pergi') return;
                    const { n, ms } = BIRD[s];
                    if (s === 'diam' || s === 'terbang') {
                        birdIdx = (birdIdx + 1) % n;            // berputar
                    } else if (s === 'pulang') {
                        // dua frame pertama = mengepak masuk (berputar), dua frame
                        // terakhir = hinggap (diputar saat sampai, lihat animationend)
                        birdIdx = birdIdx < 2 ? 1 - birdIdx : Math.min(birdIdx + 1, n - 1);
                    } else if (s === 'bersiap') {
                        if (birdIdx >= n - 1) { birdSet('terbang'); return birdJadwal(); }
                        birdIdx++;
                    }
                    birdGambar(n);
                    birdJadwal();
                }
                function birdJadwal() {
                    clearTimeout(birdTimer);
                    if (birdState !== 'pergi') birdTimer = setTimeout(birdDetak, BIRD[birdState].ms);
                }

                ttlBird.addEventListener('animationend', e => {
                    if (e.animationName === 'birdAway') {
                        // sudah di luar layar: sembunyi sebentar, lalu pulang dari kiri
                        birdSet('pergi');
                        birdTimer = setTimeout(() => { birdSet('pulang'); birdJadwal(); }, 2500);
                    } else if (e.animationName === 'birdBack') {
                        // sampai di dahan: mainkan dua frame hinggap, lalu kembali diam
                        clearTimeout(birdTimer);
                        birdIdx = 2; birdGambar(BIRD.pulang.n);
                        birdTimer = setTimeout(() => {
                            birdIdx = 3; birdGambar(BIRD.pulang.n);
                            birdTimer = setTimeout(() => { birdSet('diam'); birdJadwal(); }, 180);
                        }, 180);
                    }
                });

                // klik hanya berlaku saat diam -- selama urutan berjalan diabaikan
                ttlBird.addEventListener('click', () => {
                    if (birdState !== 'diam') return;
                    birdBubble.classList.remove('tampil');
                    void birdBubble.offsetWidth;
                    birdBubble.classList.add('tampil');
                    birdSet('bersiap'); birdJadwal();
                });
                birdBubble.addEventListener('animationend', () => birdBubble.classList.remove('tampil'));

                birdSet('diam'); birdJadwal();
            }

            // ajakan memutar layar boleh diabaikan
            const rhLanjut = document.querySelector('#rotate-hint .rh-lanjut');
            if (rhLanjut) rhLanjut.addEventListener('click', () => document.body.classList.add('abaikan-putar'));

            // ---- kendali daftar lagu ----
            const btnPlay = document.getElementById('btn-play');
            const musTitle = document.getElementById('mus-title');

            function renderMusik() {
                musTitle.textContent = playlist[trekIndex].judul;
                btnPlay.classList.toggle('jeda', bgmAudio.paused);
                btnPlay.classList.toggle('main', !bgmAudio.paused);
                btnPlay.title = (bgmAudio.paused ? 'Putar' : 'Jeda') + ' \u2014 ' + playlist[trekIndex].judul;
                btnMute.style.opacity = (bgmAudio.paused || volume === 0) ? '0.45' : '1';
            }

            function putarTrek(i) {
                trekIndex = (i + playlist.length) % playlist.length;
                bgmAudio.src = encodeURI(playlist[trekIndex].berkas);
                bgmAudio.volume = volume;
                musicStarted = true;
                bgmAudio.play().catch(err => console.log('[BGM] gagal memutar:', err));
                renderMusik();
            }

            // lagu habis -> geser indeks ke lagu berikutnya, memutar terus
            bgmAudio.addEventListener('ended', () => putarTrek(trekIndex + 1));
            ['play', 'pause'].forEach(ev => bgmAudio.addEventListener(ev, renderMusik));

            btnPlay.addEventListener('click', () => {
                if (bgmAudio.paused) {
                    musicStarted = true;
                    bgmAudio.volume = volume;
                    bgmAudio.play().catch(err => console.log('[BGM] gagal memutar:', err));
                } else {
                    bgmAudio.pause();
                }
                renderMusik();
            });
            document.getElementById('btn-track-prev').addEventListener('click', () => putarTrek(trekIndex - 1));
            document.getElementById('btn-track-next').addEventListener('click', () => putarTrek(trekIndex + 1));

            renderVolume();
            renderMusik();

            document.getElementById('btn-vol-down').addEventListener('click', () => changeVolume(-VOL_STEP));
            document.getElementById('btn-vol-up').addEventListener('click', () => changeVolume(VOL_STEP));

            // cadangan: kalau musik belum jalan, mulai pada interaksi pertama apa pun
            ['click', 'keydown'].forEach(ev =>
                document.addEventListener(ev, startMusic, { once: true }));

            // ================= PEMANASAN ASET LAYAR BERIKUTNYA =================
            // Layar yang masih display:none tidak diunduh gambarnya oleh
            // browser, jadi overlay loading & layar sandi tadinya tampil
            // kosong saat pertama kali dibuka. Semua diunduh SATU PER SATU,
            // baru dimulai setelah event load (layar judul sudah utuh) supaya
            // tidak berebut jalur dengan latar/pohon/kucing yang sedang tampil.
            // Urutannya mengikuti urutan layar yang akan ditemui pengguna.
            const antreanPemanasan = [
                'gambarpixel/anim/loading_sky.webp',
                'gambarpixel/anim/gallop_sheet.webp',
                'gambarpixel/anim/pw_bg_hi.webp',
                'gambarpixel/anim/guard_sheet.webp',
                'gambarpixel/anim/guard_left_1.webp',
                'gambarpixel/anim/guard_left_2.webp',
                'gambarpixel/anim/guard_left_3.webp',
                'gambarpixel/anim/guard_right_1.webp',
                'gambarpixel/anim/guard_right_2.webp',
                'gambarpixel/anim/guard_right_3.webp',
                'MUSIK',
                'gambarpixel/anim/cat_groom.webp',
                'gambarpixel/anim/emote_miaw.webp',
                'gambarpixel/anim/emote_purr.webp',
                'gambarpixel/anim/emote_meong.webp',
                'gambarpixel/anim/bird_preflight.webp',
                'gambarpixel/anim/bird_fly.webp',
                'gambarpixel/anim/bird_return.webp',
                'gambarpixel/anim/emote_burung.webp',
                'gambarpixel/anim/heart_pop.png',
                'gambarpixel/anim/dashboard_hi.webp',
                'gambarpixel/anim/dash_loop_hi.webp',
                'gambarpixel/anim/horse_walk.webp',
                'gambarpixel/anim/logo_sorrow.webp',
                'gambarpixel/anim/btn_vol_up.webp',
                'gambarpixel/anim/btn_vol_down.webp'
            ];
            function panaskanBerikutnya() {
                const src = antreanPemanasan.shift();
                if (!src) return;
                if (src === 'MUSIK') {
                    // kalau pengguna sudah menekan START, play() sudah mengunduhnya sendiri
                    if (!musicStarted) { bgmAudio.preload = 'auto'; bgmAudio.load(); }
                    panaskanBerikutnya();
                    return;
                }
                const im = new Image();
                im.onload = im.onerror = () => setTimeout(panaskanBerikutnya, 0);
                im.src = src;
            }
            if (document.readyState === 'complete') panaskanBerikutnya();
            else window.addEventListener('load', panaskanBerikutnya, { once: true });

            // 5. Aksi Tombol Mute Audio
            btnMute.addEventListener('click', () => {
                if (bgmAudio.paused) {
                    bgmAudio.play();
                } else {
                    bgmAudio.pause();
                }
                renderVolume();
            });
        });
    </script>
    <!-- AJAKAN MEMUTAR LAYAR (hanya muncul di HP posisi tegak) -->
    <div id="rotate-hint">
        <img class="rh-ikon" src="gambarpixel/anim/ico_about_hi.png" alt="">
        <p>PUTAR LAYARMU</p>
        <small>Land of Sorrow dibuat melebar ke samping.<br>Miringkan HP-mu supaya muat.</small>
        <button class="rh-lanjut" type="button">LANJUT SAJA</button>
    </div>

    <!-- PEMUTAR MUSIK (tetap terlihat walau halaman digulir) -->
    <div id="music-bar">
        <img class="mus-btn" id="btn-track-prev" src="gambarpixel/anim/btn_prev.webp"
             alt="Lagu sebelumnya" title="Lagu sebelumnya">
        <img class="mus-btn" id="btn-play" src="gambarpixel/anim/btn_play.webp"
             alt="Putar / jeda" title="Putar / jeda">
        <img class="mus-btn" id="btn-track-next" src="gambarpixel/anim/btn_next.webp"
             alt="Lagu berikutnya" title="Lagu berikutnya">
        <span id="mus-title"></span>
    </div>
</body>
</html>
